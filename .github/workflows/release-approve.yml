name: Canonical ClientFlow release approval

"on":
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: Exact 40-character source SHA of the reproducible candidate
        required: true
        type: string
      expected_candidate_sha256:
        description: Exact SHA-256 of the candidate bundle from REPRODUCIBILITY.json
        required: true
        type: string
      expected_installer_sha256:
        description: Exact SHA-256 of the embedded fresh installer
        required: true
        type: string
      approval_reference:
        description: Immutable manual release approval reference
        required: true
        type: string
      approve_release:
        description: I explicitly approve these exact candidate bytes
        required: true
        type: boolean
        default: false

permissions: {}

concurrency:
  group: clientflow-release-approval-${{ inputs.expected_source_sha }}
  cancel-in-progress: false

jobs:
  approve:
    name: Approve exact reproducible candidate on Ubuntu 26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read

    steps:
      - name: Require explicit immutable approval inputs
        shell: bash
        env:
          APPROVE_RELEASE: ${{ inputs.approve_release }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.expected_candidate_sha256 }}
          EXPECTED_INSTALLER_SHA256: ${{ inputs.expected_installer_sha256 }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          test "$APPROVE_RELEASE" = "true"
          [[ "$EXPECTED_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_INSTALLER_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test -n "$APPROVAL_REFERENCE"
          test "${#APPROVAL_REFERENCE}" -le 200

      - name: Resolve successful exact-source release-build run
        id: release_run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/actions/workflows/release-build.yml/runs?event=workflow_dispatch&status=success&per_page=100",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          matches = [
              run for run in payload.get("workflow_runs", [])
              if run.get("head_sha") == expected
              and run.get("path") == ".github/workflows/release-build.yml"
              and run.get("event") == "workflow_dispatch"
              and run.get("status") == "completed"
              and run.get("conclusion") == "success"
          ]
          if not matches:
              raise SystemExit("no_successful_exact_source_release_build")
          run = max(matches, key=lambda item: (int(item.get("run_number") or 0), int(item.get("id") or 0)))
          run_id = int(run["id"])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run_id}\n")
          print(f"RELEASE_BUILD_RUN_VERIFIED={run_id}")
          PY

      - name: Checkout exact candidate source commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.expected_source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact Ubuntu 26.04 approval host
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'import platform, sys; print(platform.python_version()); assert sys.version_info[:2] == (3, 14)'
          /usr/bin/python3 scripts/verify_clientflow_ubuntu2604_host.py --repo "$GITHUB_WORKSPACE"

      - name: Download exact reproducible unapproved handoff
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: clientflow-reproducible-unapproved-${{ inputs.expected_source_sha }}
          path: ${{ runner.temp }}/handoff
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.release_run.outputs.run_id }}

      - name: Verify handoff provenance and exact candidate bytes
        id: handoff
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.expected_candidate_sha256 }}
          EXPECTED_INSTALLER_SHA256: ${{ inputs.expected_installer_sha256 }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "handoff"
          record = json.loads((root / "REPRODUCIBILITY.json").read_text(encoding="utf-8"))
          expected_source = os.environ["EXPECTED_SOURCE_SHA"]
          expected_candidate = os.environ["EXPECTED_CANDIDATE_SHA256"]
          expected_installer = os.environ["EXPECTED_INSTALLER_SHA256"]
          if record.get("reproducible") is not True:
              raise SystemExit("handoff_is_not_reproducible")
          if record.get("source_commit") != expected_source:
              raise SystemExit("handoff_source_sha_mismatch")
          candidates = sorted(root.glob("*-candidate.tar"))
          if len(candidates) != 1:
              raise SystemExit(f"expected_one_candidate_tar_found_{len(candidates)}")
          candidate = candidates[0]
          installer = root / f"clientflow-installer-{record.get('version')}.pyz"
          artifacts = record.get("artifacts") or {}
          candidate_record = artifacts.get(candidate.name) or {}
          installer_record = artifacts.get(installer.name) or {}
          if candidate_record.get("sha256") != expected_candidate:
              raise SystemExit("handoff_candidate_sha_mismatch")
          if installer_record.get("sha256") != expected_installer:
              raise SystemExit("handoff_installer_sha_mismatch")
          digest = hashlib.sha256()
          with candidate.open("rb") as handle:
              for block in iter(lambda: handle.read(1024 * 1024), b""):
                  digest.update(block)
          digest = digest.hexdigest()
          if digest != expected_candidate:
              raise SystemExit("candidate_file_sha_mismatch")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"candidate={candidate}\n")
          print(f"CANDIDATE_SHA256={digest}")
          PY

      - name: Approve exact candidate with canonical source approval gate
        id: approval
        shell: bash
        env:
          CANDIDATE: ${{ steps.handoff.outputs.candidate }}
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.expected_candidate_sha256 }}
          EXPECTED_INSTALLER_SHA256: ${{ inputs.expected_installer_sha256 }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/approved"
          APPROVED="$RUNNER_TEMP/approved/clientflow-approved.tar"
          /usr/bin/python3 scripts/approve_clientflow_release.py \
            "$CANDIDATE" \
            --output "$APPROVED" \
            --expected-candidate-sha256 "$EXPECTED_CANDIDATE_SHA256" \
            --expected-installer-sha256 "$EXPECTED_INSTALLER_SHA256" \
            --expected-source-commit "$EXPECTED_SOURCE_SHA" \
            --approval-reference "$APPROVAL_REFERENCE" \
            --approve-release | tee "$RUNNER_TEMP/approved/APPROVAL.txt"
          APPROVED_SHA256="$(sha256sum "$APPROVED" | awk '{print $1}')"
          APPROVED_SIZE="$(stat -c '%s' "$APPROVED")"
          printf 'approved_sha256=%s\n' "$APPROVED_SHA256" >> "$GITHUB_OUTPUT"
          printf 'approved_size=%s\n' "$APPROVED_SIZE" >> "$GITHUB_OUTPUT"
          printf 'APPROVED_BUNDLE_SHA256=%s\nAPPROVED_BUNDLE_SIZE=%s\n' "$APPROVED_SHA256" "$APPROVED_SIZE" | tee -a "$RUNNER_TEMP/approved/APPROVAL.txt"

      - name: Write immutable approval record
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          EXPECTED_CANDIDATE_SHA256: ${{ inputs.expected_candidate_sha256 }}
          EXPECTED_INSTALLER_SHA256: ${{ inputs.expected_installer_sha256 }}
          APPROVAL_REFERENCE: ${{ inputs.approval_reference }}
          RELEASE_BUILD_RUN_ID: ${{ steps.release_run.outputs.run_id }}
          APPROVED_SHA256: ${{ steps.approval.outputs.approved_sha256 }}
          APPROVED_SIZE: ${{ steps.approval.outputs.approved_size }}
        run: |
          set -euo pipefail
          /usr/bin/python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          record = {
              "schema_version": 1,
              "release_build_run_id": int(os.environ["RELEASE_BUILD_RUN_ID"]),
              "source_commit": os.environ["EXPECTED_SOURCE_SHA"],
              "candidate_sha256": os.environ["EXPECTED_CANDIDATE_SHA256"],
              "installer_sha256": os.environ["EXPECTED_INSTALLER_SHA256"],
              "approval_reference": os.environ["APPROVAL_REFERENCE"],
              "approved_bundle_sha256": os.environ["APPROVED_SHA256"],
              "approved_bundle_size": int(os.environ["APPROVED_SIZE"]),
          }
          target = Path(os.environ["RUNNER_TEMP"]) / "approved" / "APPROVAL.json"
          target.write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload approved immutable handoff
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: clientflow-approved-${{ inputs.expected_source_sha }}
          path: ${{ runner.temp }}/approved/
          if-no-files-found: error
          retention-days: 30
