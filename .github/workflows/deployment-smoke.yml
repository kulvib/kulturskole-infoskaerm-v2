name: Production smoke test

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Read-only production smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Require main branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main" || {
            echo "Production smoke test must be dispatched from main" >&2
            exit 2
          }

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.14"

      - name: Run read-only production readiness checks
        env:
          BASE_URL: https://display.planiq.dk
          EXPECTED_PRODUCT: PlanIQ Display
          EXPECTED_COMMIT: ${{ github.sha }}
        run: >-
          python scripts/check_production_readiness.py
          --base-url "$BASE_URL"
          --expected-product "$EXPECTED_PRODUCT"
          --expected-commit "$EXPECTED_COMMIT"
