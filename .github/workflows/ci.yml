name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend, migrations and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: planiq_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d planiq_ci"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/planiq_ci
      ENVIRONMENT: development
      SECRET_KEY: ci-only-secret-key-that-is-longer-than-thirty-two-characters
      PYTHONPATH: backend
      MIGRATION_ALLOW_EMPTY_DATABASE: "true"
      MIGRATION_ADVISORY_LOCK_TIMEOUT_SECONDS: "30"
      MIGRATION_LOCK_TIMEOUT_SECONDS: "10"
      MIGRATION_STATEMENT_TIMEOUT_SECONDS: "120"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13.16"
          pip-version: "26.1.2"
          cache: "pip"
          cache-dependency-path: requirements-ci.lock.txt

      - name: Verify Python toolchain
        shell: bash
        run: |
          set -euo pipefail
          test "$(python -c 'import platform; print(platform.python_version())')" = "3.13.16"
          test "$(python -m pip --version | awk '{print $2}')" = "26.1.2"

      - name: Install hash-locked CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.lock.txt

      - name: Verify dependency contract
        run: |
          python -m pip check
          python scripts/validate_dependency_contract.py
          python backend/scripts/validate_display_baseline.py

      - name: Static Python checks
        run: |
          python -m ruff check backend/service1 backend/scripts scripts --select F
          python -m ruff check backend/clientflow_release_format --select F
          python -m compileall -q backend/clientflow_release_format backend/service1 backend/migrations client/runtime client/release/lib scripts

      - name: Audit production Python dependencies
        run: python -m pip_audit --disable-pip --no-deps --progress-spinner off -r backend/requirements.lock.txt

      - name: Migrate empty PostgreSQL database to canonical head
        run: python backend/scripts/run_migrations.py

      - name: Verify migration runner is idempotent at head
        run: python backend/scripts/run_migrations.py

      - name: Run Python test suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest -q \
            --ignore=backend/tests/test_clientflow_claim_operational_http_integration.py \
            --ignore=backend/tests/test_clientflow_display_runtime_integration.py \
            --ignore=backend/tests/test_clientflow_frontend_backend_openapi_contract.py \
            --ignore=backend/tests/test_clientflow_operational_compatibility_gate.py \
            --ignore=backend/tests/test_clientflow_operational_http_integration.py \
            --ignore=backend/tests/test_clientflow_readiness_contracts.py \
            --ignore=backend/tests/test_clientflow_update_chain_operational_integration.py \
            --ignore=backend/tests/test_livestream_v2_explicit_stop.py \
            --ignore=backend/tests/test_livestream_v2_isolation_source.py \
            --ignore=backend/tests/test_remote_desktop_v2_file_library_contract.py \
            --ignore=backend/tests/test_remote_desktop_v2_isolation_source.py \
            --ignore=backend/tests/test_system_authority_53b_source.py \
            --ignore=backend/tests/test_terminal_auth_trust_boundary.py \
            --ignore=backend/tests/test_terminal_v2_contract.py \
            --ignore=scripts/tests/test_clientflow_calendar_53c.py \
            --ignore=scripts/tests/test_clientflow_code_only_fresh_install.py \
            --ignore=scripts/tests/test_clientflow_display_platform_53a.py \
            --ignore=scripts/tests/test_clientflow_factory_network_preclaim.py \
            --ignore=scripts/tests/test_clientflow_human_account_lifecycle_closure.py \
            --ignore=scripts/tests/test_clientflow_legacy119_desktop_contract.py \
            --ignore=scripts/tests/test_clientflow_local_power_contract_closure.py \
            --ignore=scripts/tests/test_clientflow_local_ux_legacy119.py \
            --ignore=scripts/tests/test_clientflow_platform_session_policy_legacy119.py \
            --ignore=scripts/tests/test_clientflow_pre_first_activation_repair.py \
            --ignore=scripts/tests/test_clientflow_preclaim_host_readiness.py \
            --ignore=scripts/tests/test_clientflow_release_build_51k.py \
            --ignore=scripts/tests/test_clientflow_runtime_input_transport_51l.py \
            backend/tests scripts/tests

      - name: Execute ClientFlow synthetic end-to-end operational gate
        run: |
          python -m pytest -q \
            backend/tests/test_clientflow_claim_operational_http_integration.py \
            backend/tests/test_clientflow_operational_http_integration.py \
            backend/tests/test_clientflow_update_chain_operational_integration.py \
            backend/tests/test_clientflow_frontend_backend_openapi_contract.py \
            backend/tests/test_clientflow_operational_compatibility_gate.py \
            scripts/tests/test_clientflow_code_only_fresh_install.py

      - name: Execute legacy 1.1.19 capability parity gate
        run: python scripts/verify_clientflow_legacy119_capability_gate.py --repo "$GITHUB_WORKSPACE" --scope python

  client-host-ubuntu-2604-scope:
    name: Ubuntu 26.04 executable proof scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      preclaim_required: ${{ steps.scope.outputs.preclaim_required }}
      platform_required: ${{ steps.scope.outputs.platform_required }}

    steps:
      - name: Checkout repository with history for change classification
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify Ubuntu 26.04 executable proof scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "preclaim_required=true" >> "$GITHUB_OUTPUT"
            echo "platform_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [ -z "$base" ] || [[ "$base" =~ ^0+$ ]]; then
            echo "preclaim_required=true" >> "$GITHUB_OUTPUT"
            echo "platform_required=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          preclaim_required=false
          platform_required=false
          mapfile -t changed_files < <(git diff --name-only "$base" "$head")

          printf 'Ubuntu 26.04 scope changed files (%s):\n' "${#changed_files[@]}"
          printf '  %s\n' "${changed_files[@]}"

          for path in "${changed_files[@]}"; do
            case "$path" in
              .github/workflows/ci.yml)
                preclaim_required=true
                platform_required=true
                ;;
              client/release/runtime-platform-inputs.lock.json|client/release/lib/clientflow_release/*)
                preclaim_required=true
                platform_required=true
                ;;
              scripts/verify_clientflow_preclaim_bootstrap_ubuntu2604.py)
                preclaim_required=true
                ;;
              client/*|backend/clientflow_release_format/*|scripts/verify_clientflow_ubuntu2604_host.py|scripts/verify_clientflow_legacy119_capability_gate.py)
                platform_required=true
                ;;
            esac
          done

          echo "preclaim_required=$preclaim_required" >> "$GITHUB_OUTPUT"
          echo "platform_required=$platform_required" >> "$GITHUB_OUTPUT"

  client-host-ubuntu-2604:
    name: Ubuntu 26.04 client host executable contracts
    needs:
      - client-host-ubuntu-2604-scope
      - client-host-ubuntu-2604-preclaim
      - client-host-ubuntu-2604-platform
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require applicable Ubuntu 26.04 executable proof jobs
        shell: bash
        env:
          SCOPE_RESULT: ${{ needs.client-host-ubuntu-2604-scope.result }}
          PRECLAIM_REQUIRED: ${{ needs.client-host-ubuntu-2604-scope.outputs.preclaim_required }}
          PLATFORM_REQUIRED: ${{ needs.client-host-ubuntu-2604-scope.outputs.platform_required }}
          PRECLAIM_RESULT: ${{ needs.client-host-ubuntu-2604-preclaim.result }}
          PLATFORM_RESULT: ${{ needs.client-host-ubuntu-2604-platform.result }}
        run: |
          set -euo pipefail
          test "$SCOPE_RESULT" = "success"

          if [ "$PRECLAIM_REQUIRED" = "true" ]; then
            test "$PRECLAIM_RESULT" = "success"
          else
            test "$PRECLAIM_RESULT" = "skipped"
          fi

          if [ "$PLATFORM_REQUIRED" = "true" ]; then
            test "$PLATFORM_RESULT" = "success"
          else
            test "$PLATFORM_RESULT" = "skipped"
          fi

  client-host-ubuntu-2604-preclaim:
    name: Ubuntu 26.04 preclaim recovery proof
    needs: client-host-ubuntu-2604-scope
    if: ${{ needs.client-host-ubuntu-2604-scope.outputs.preclaim_required == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prove preclaim APT and curl recovery on ephemeral Ubuntu 26.04 host
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 scripts/verify_clientflow_preclaim_bootstrap_ubuntu2604.py \
            --repo "$GITHUB_WORKSPACE"

  client-host-ubuntu-2604-platform:
    name: Ubuntu 26.04 platform capability proof
    needs: client-host-ubuntu-2604-scope
    if: ${{ needs.client-host-ubuntu-2604-scope.outputs.platform_required == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify exact Ubuntu 26.04 host, system Python and systemd contracts
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -c 'import platform, sys; print(platform.python_version()); assert sys.version_info[:2] == (3, 14)'
          /usr/bin/python3 scripts/verify_clientflow_ubuntu2604_host.py --repo "$GITHUB_WORKSPACE"

      - name: Install and verify canonical ClientFlow host capabilities
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 scripts/verify_clientflow_ubuntu2604_host.py \
            --repo "$GITHUB_WORKSPACE" \
            --install-platform-requirements

      - name: Execute legacy 1.1.19 Ubuntu host capability gate
        shell: bash
        run: |
          set -euo pipefail
          sudo /usr/bin/python3 scripts/verify_clientflow_legacy119_capability_gate.py \
            --repo "$GITHUB_WORKSPACE" \
            --scope host

  frontend:
    name: Frontend contracts and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          package-manager-cache: false

      - name: Verify Node.js toolchain
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          test "$(node --version)" = "v24.21.0"
          test "$(npm --version)" = "11.19.0"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm run audit:dependencies

      - name: Run dependency and upgrade contracts
        working-directory: frontend
        run: |
          npm run test:dependency-runtime
          npm run test:mui-react-upgrade
          npm run test:snackbar-contract

      - name: Run complete frontend test suite
        working-directory: frontend
        run: node --test tests/*.test.mjs

      - name: Execute ClientFlow frontend/backend API contract gate
        working-directory: frontend
        run: node --test tests/clientflowFrontendBackendExecutableContract.test.mjs

      - name: Execute legacy 1.1.19 frontend capability parity gate
        run: python3 scripts/verify_clientflow_legacy119_capability_gate.py --repo "$GITHUB_WORKSPACE" --scope frontend

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Build production frontend
        working-directory: frontend
        run: npm run build
