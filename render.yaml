services:
  - type: web
    name: clientflow-livestream
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend

    buildCommand: >
      python -m pip install --upgrade pip &&
      python -m pip install --no-cache-dir -r requirements.txt &&
      alembic upgrade head

    startCommand: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 1
      --log-level info

    healthCheckPath: /health
    autoDeployTrigger: commit

    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: clientflow-livestream-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: CREDENTIAL_PEPPER
        generateValue: true

      - key: TOKEN_ISSUER
        value: clientflow-api

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false

      - key: ADMIN_ORG_NAME
        value: Kulturskolen

      - key: MEDIA_STALE_SECONDS
        value: "45"

databases:
  - name: clientflow-livestream-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
