services:

  # ─── Canonical v2 backend ──────────────────────────────────────────────────
  - type: web
    name: planiq-display-v2-backend
    runtime: python
    region: frankfurt
    plan: starter
    numInstances: 1
    rootDir: backend
    buildCommand: "python -m pip install --upgrade pip==26.1.2 && python -m pip install --require-hashes --no-cache-dir -r requirements.lock.txt"
    preDeployCommand: "python scripts/run_migrations.py"
    startCommand: "python -m uvicorn service1.main:app --host 0.0.0.0 --port $PORT --workers 1 --log-level info"
    healthCheckPath: /health

    domains:
      - api.display.planiq.dk

    # 51M: canonical runtime authority for approved immutable ClientFlow bundles.
    # The filesystem-backed authority requires one persistent disk and one
    # service instance. Publication happens only in the running service context.
    disk:
      name: clientflow-release-artifacts
      mountPath: /var/data/clientflow-release-artifacts
      sizeGB: 1

    envVars:
      - key: ENVIRONMENT
        value: "production"

      - key: PYTHON_VERSION
        value: "3.13.14"

      - key: SECRET_KEY
        sync: false

      - key: JWT_ISSUER
        value: "planiq-display-api"
      - key: JWT_AUDIENCE
        value: "planiq-display"

      # Neon is the database authority. Render provisions no database resource.
      - key: DATABASE_URL
        sync: false

      # Existing Neon databases are never treated as empty/factory databases by default.
      - key: MIGRATION_ALLOW_EMPTY_DATABASE
        value: "false"
      - key: MIGRATION_ADVISORY_LOCK_TIMEOUT_SECONDS
        value: "120"
      - key: MIGRATION_LOCK_TIMEOUT_SECONDS
        value: "10"
      - key: MIGRATION_STATEMENT_TIMEOUT_SECONDS
        value: "300"

      - key: CORS_ALLOW_ORIGINS
        value: "https://display.planiq.dk"
      - key: FRONTEND_URL
        value: "https://display.planiq.dk"
      - key: PASSWORD_RESET_FRONTEND_URL
        value: "https://display.planiq.dk"

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: SESSION_ABSOLUTE_TIMEOUT_MINUTES
        value: "360"
      - key: REFRESH_TOKEN_RETENTION_DAYS
        value: "7"
      - key: REFRESH_TOKEN_CLEANUP_INTERVAL_SECONDS
        value: "3600"
      - key: REFRESH_COOKIE_NAME
        value: "refresh_token"
      - key: REFRESH_COOKIE_PATH
        value: "/api/auth"
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: "lax"
      - key: ACCESS_COOKIE_SAMESITE
        value: "lax"

      - key: BROWSER_WS_TICKET_TTL_SECONDS
        value: "30"
      - key: BROWSER_WS_TICKET_MAX_PENDING
        value: "2048"

      - key: TERMINAL_BROWSER_WS_TICKET_TTL_SECONDS
        value: "30"
      - key: TERMINAL_BROWSER_WS_TICKET_MAX_PENDING
        value: "2048"

      # Frozen Terminal trust contract: configuration preserved, code untouched.
      - key: CLIENTFLOW_TERMINAL_AUTH_KEY_B64
        sync: false
      - key: CLIENTFLOW_TERMINAL_AUTH_ISSUER
        value: "clientflow-terminal-auth"
      - key: CLIENTFLOW_TERMINAL_TOKEN_ISSUER
        value: "planiq-display-api"
      - key: CLIENTFLOW_TERMINAL_TOKEN_TTL_SECONDS
        value: "600"
      - key: CLIENTFLOW_ROOT_TERMINAL_KEY_B64
        sync: false
      - key: CLIENTFLOW_ROOT_TERMINAL_KEY_ID
        sync: false

      # Frozen Remote Desktop trust contract: configuration preserved, code untouched.
      - key: CLIENTFLOW_REMOTE_DESKTOP_AUTH_KEY_B64
        sync: false
      - key: CLIENTFLOW_REMOTE_DESKTOP_TOKEN_ISSUER
        value: "planiq-display-api"
      - key: CLIENTFLOW_REMOTE_DESKTOP_TOKEN_TTL_SECONDS
        value: "600"

      # 51N: dedicated signing key for one-time immutable fresh-install capabilities.
      - key: CLIENTFLOW_FRESH_INSTALL_AUTH_KEY_B64
        generateValue: true

      - key: PASSWORD_RESET_EXPIRE_MINUTES
        value: "30"

      - key: RATE_LIMIT_NAMESPACE
        value: "planiq-display"
      - key: RATE_LIMIT_REDIS_REQUIRED
        value: "false"
      - key: RATE_LIMIT_MEMORY_MAX_KEYS
        value: "10000"

      - key: AUDIT_LOG_RETENTION_DAYS
        value: "90"

      - key: CLIENTFLOW_RELEASE_ARTIFACT_DIR
        value: "/var/data/clientflow-release-artifacts"

      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "2"
      - key: DB_POOL_TIMEOUT
        value: "20"
      - key: DB_POOL_RECYCLE
        value: "300"

      - key: PRODUCT_NAME
        value: "PlanIQ Display"
      - key: PRODUCT_SHORT_NAME
        value: "Display"
      - key: PRODUCT_DOMAIN
        value: "display.planiq.dk"

      - key: MAIL_FROM_NAME
        value: "PlanIQ Display"
      - key: MAIL_PRODUCT_NAME
        value: "PlanIQ Display"
      - key: MAIL_LOGO_URL
        value: "https://display.planiq.dk/brand/planiq-display/planiq-display-logo.png"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      - key: CLIENTFLOW_ONLINE_TIMEOUT_SECONDS
        value: "30"

      # Frozen Livestream/HLS runtime configuration: values preserved, code untouched.
      - key: HLS_BASE_DIR
        value: "/opt/render/project/src/backend/service1/hls"
      - key: HLS_MANIFEST_KEEP_N
        value: "8"
      - key: HLS_STALE_SECONDS
        value: "12"
      - key: HLS_VIEWER_HEARTBEAT_SWEEP_SECONDS
        value: "30"
      - key: HLS_VIEWER_HEARTBEAT_TIMEOUT_SECONDS
        value: "180"
      - key: LIVESTREAM_V2_VIEWER_HEARTBEAT_SECONDS
        value: "10"
      - key: LIVESTREAM_V2_VIEWER_LEASE_SECONDS
        value: "30"
      - key: LIVESTREAM_V2_VIEWER_STOP_GRACE_SECONDS
        value: "30"
      - key: LIVESTREAM_V2_VIEWER_SWEEP_SECONDS
        value: "5"
      - key: LIVESTREAM_V2_MEDIA_STALE_SECONDS
        value: "45"
      - key: LIVESTREAM_V2_TOKEN_ISSUER
        value: "clientflow-api"
      - key: LIVESTREAM_V2_CREDENTIAL_PEPPER
        sync: false

      - key: PYTHONUNBUFFERED
        value: "1"

  # ─── Frontend ───────────────────────────────────────────────────────────────
  - type: web
    name: planiq-display-v2-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm ci && npm run build"
    staticPublishPath: ./dist

    domains:
      - display.planiq.dk

    headers:
      - path: /release.json
        name: Cache-Control
        value: "no-store, max-age=0"

      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; style-src-elem 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob:; media-src 'self' https: blob:; connect-src 'self' https: wss:; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "geolocation=(), camera=(), microphone=(), payment=(), usb=(), bluetooth=(), accelerometer=(), gyroscope=(), magnetometer=()"
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin

      - path: /
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
      - path: /index.html
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
      - path: /*.html
        name: Cache-Control
        value: "no-store, no-cache, must-revalidate, max-age=0"

    routes:
      - type: rewrite
        source: /version
        destination: https://api.display.planiq.dk/version

      # Same-origin browser API remains canonical for HttpOnly refresh cookies.
      - type: rewrite
        source: /api/*
        destination: https://api.display.planiq.dk/api/*

      - type: rewrite
        source: /health
        destination: https://api.display.planiq.dk/health
      - type: rewrite
        source: /health/*
        destination: https://api.display.planiq.dk/health/*

      - type: rewrite
        source: /hls/*
        destination: https://api.display.planiq.dk/hls/*

      # SPA fallback must stay last.
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: VITE_API_URL
        value: ""
      - key: VITE_WS_API_URL
        value: "https://api.display.planiq.dk"
